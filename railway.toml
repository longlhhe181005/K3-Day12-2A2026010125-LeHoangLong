# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard hoặc:
#     railway variables --set AGENT_API_KEY=...
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

# Không đặt startCommand ở đây: Railway chạy startCommand KHÔNG qua shell,
# nên "$PORT" bị truyền nguyên văn thay vì được thay giá trị (lỗi
# "'$PORT' is not a valid integer"). Dùng thẳng CMD trong Dockerfile —
# CMD đó đã bọc "sh -c" nên $PORT được shell expand đúng.

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

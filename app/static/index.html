<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Day 12 Agent</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --accent: #5b8cff;
    --user-bubble: #2a3550;
    --assistant-bubble: #1f2430;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  main {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
  }
  header p {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  .config {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    background: var(--panel);
  }
  .config input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
  }
  .config label {
    font-size: 11px;
    color: var(--muted);
    display: block;
    margin-bottom: 4px;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--user-bubble);
  }
  .bubble.assistant {
    align-self: flex-start;
    background: var(--assistant-bubble);
  }
  .bubble.error {
    align-self: flex-start;
    background: transparent;
    border: 1px solid var(--error);
    color: var(--error);
  }
  .meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    height: 44px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .empty {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    margin-top: 40px;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Day 12 Production Agent</h1>
    <p>Gọi trực tiếp vào <code>/ask</code> — cần API key hợp lệ.</p>
  </header>

  <div class="config">
    <div>
      <label for="apiKey">X-API-Key</label>
      <input id="apiKey" type="password" placeholder="dán API key" autocomplete="off" />
    </div>
    <div>
      <label for="userId">X-User-Id (tuỳ chọn)</label>
      <input id="userId" type="text" placeholder="mặc định: anonymous" autocomplete="off" />
    </div>
  </div>

  <div id="log">
    <p class="empty">Chưa có tin nhắn nào. Nhập API key rồi đặt câu hỏi bên dưới.</p>
  </div>

  <form id="form">
    <textarea id="question" placeholder="Hỏi agent..." maxlength="2000"></textarea>
    <button id="send" type="submit">Gửi</button>
  </form>
</main>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const questionEl = document.getElementById("question");
  const apiKeyEl = document.getElementById("apiKey");
  const userIdEl = document.getElementById("userId");
  const sendBtn = document.getElementById("send");

  apiKeyEl.value = localStorage.getItem("day12_api_key") || "";
  userIdEl.value = localStorage.getItem("day12_user_id") || "";
  apiKeyEl.addEventListener("change", () => localStorage.setItem("day12_api_key", apiKeyEl.value));
  userIdEl.addEventListener("change", () => localStorage.setItem("day12_user_id", userIdEl.value));

  function clearEmptyState() {
    const empty = log.querySelector(".empty");
    if (empty) empty.remove();
  }

  function addBubble(role, text, meta) {
    clearEmptyState();
    const bubble = document.createElement("div");
    bubble.className = "bubble " + role;
    bubble.textContent = text;
    if (meta) {
      const metaEl = document.createElement("div");
      metaEl.className = "meta";
      metaEl.textContent = meta;
      bubble.appendChild(metaEl);
    }
    log.appendChild(bubble);
    log.scrollTop = log.scrollHeight;
    return bubble;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = questionEl.value.trim();
    if (!question) return;

    const apiKey = apiKeyEl.value.trim();
    const userId = userIdEl.value.trim();

    addBubble("user", question);
    questionEl.value = "";
    sendBtn.disabled = true;

    try {
      const headers = { "Content-Type": "application/json" };
      if (apiKey) headers["X-API-Key"] = apiKey;
      if (userId) headers["X-User-Id"] = userId;

      const res = await fetch("/ask", {
        method: "POST",
        headers,
        body: JSON.stringify({ question }),
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        const detail = data.detail || res.statusText;
        addBubble("error", `${res.status}: ${detail}`);
        return;
      }

      const meta = `cost $${data.cost_usd} · tokens in=${data.tokens.in} out=${data.tokens.out} · history=${data.history_length}`;
      addBubble("assistant", data.answer, meta);
    } catch (err) {
      addBubble("error", "Không gọi được server: " + err.message);
    } finally {
      sendBtn.disabled = false;
      questionEl.focus();
    }
  });

  questionEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
</script>
</body>
</html>
